name: Bootstrap FORMA creative runtime

on:
  push:
    branches:
      - phase-08/playground-motion-lab
    paths:
      - ".github/workflows/creative-stack-bootstrap.yml"

permissions:
  contents: write

jobs:
  install-and-lock:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out the Phase 08 branch
        uses: actions/checkout@v4
        with:
          ref: phase-08/playground-motion-lab
          persist-credentials: true

      - name: Set up supported Node.js runtime
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install and resolve the creative runtime
        run: |
          npm install --save-exact gsap @gsap/react three @react-three/fiber @react-three/drei
          npm ls --depth=0 gsap @gsap/react three @react-three/fiber @react-three/drei

      - name: Commit the verified manifest and lockfile
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/creative-stack-bootstrap.yml
          git add package.json package-lock.json
          if git diff --cached --quiet; then
            echo "No dependency changes were generated."
          else
            git commit -m "build: install GSAP and React Three creative runtime"
            git push origin HEAD:phase-08/playground-motion-lab
          fi

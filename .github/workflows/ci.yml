name: FORMA quality gate

on:
  push:
    branches: [main]
  pull_request:
    branches: [main, phase-09/atelier-expression, phase-10/chromatic-interface]

permissions:
  contents: read

concurrency:
  group: forma-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Type, lint, test, and production build
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run typecheck

      - name: Unit tests
        run: npm run test

      - name: Production build
        run: npm run build

<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#111214">
<meta name="description" content="FORMA Scene Studio — responsive editor interface prototype.">
<title>Scene Studio — FORMA</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@400;500&family=Inter:wght@400;500;600&family=Space+Grotesk:wght@400;500;600;700&display=swap');
:root{color-scheme:dark;--bg:#111214;--panel:#191a1c;--panel2:#202124;--paper:#f2f0ea;--muted:#9b9c95;--line:#343538;--lime:#c7f36b;--coral:#ff765e;--blue:#8294ff;--display:"Space Grotesk",Arial,sans-serif;--body:Inter,Arial,sans-serif;--mono:"DM Mono",monospace}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--paper);font-family:var(--body);font-size:12px}button,input{font:inherit;color:inherit}button{cursor:pointer}.mono,.label,.eyebrow,.status{font:9px var(--mono);letter-spacing:.09em;text-transform:uppercase}.shell{height:100dvh;min-height:620px;display:flex;flex-direction:column}.topbar{height:58px;flex:none;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:20px;padding:0 18px;background:#151618}.brand{display:flex;align-items:center;gap:10px;font:600 17px var(--display);letter-spacing:-.06em;white-space:nowrap}.mark{width:21px;height:21px;border:2px solid var(--lime);position:relative}.mark:after{content:"";position:absolute;width:6px;height:6px;right:-4px;bottom:-4px;background:var(--bg);border:1px solid var(--lime)}.divider{height:24px;width:1px;background:var(--line)}.scene-name{background:transparent;border:0;border-bottom:1px solid transparent;padding:6px 3px;width:150px;font-size:12px}.scene-name:focus{outline:0;border-color:var(--lime)}.saved{display:flex;align-items:center;gap:7px;color:var(--muted);white-space:nowrap}.dot{width:6px;height:6px;border-radius:50%;background:var(--lime)}.top-actions{margin-left:auto;display:flex;align-items:center;gap:7px}.toolbtn{border:1px solid var(--line);background:transparent;padding:8px 10px;color:var(--muted);font-size:11px}.toolbtn:hover,.toolbtn:focus-visible{border-color:var(--lime);color:var(--paper)}.toolbtn.primary{background:var(--lime);border-color:var(--lime);color:#111214;font-weight:600}.avatar{width:28px;height:28px;border-radius:50%;background:#34363a;display:grid;place-items:center;font:10px var(--mono);margin-left:5px}.workspace{flex:1;min-height:0;display:grid;grid-template-columns:238px minmax(300px,1fr) 280px}.panel{background:var(--panel);min-width:0;display:flex;flex-direction:column}.left{border-right:1px solid var(--line)}.right{border-left:1px solid var(--line)}.panel-head{height:47px;flex:none;padding:0 15px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid var(--line)}.panel-head h2{font:500 11px var(--mono);letter-spacing:.08em;text-transform:uppercase;margin:0}.iconbtn{width:27px;height:27px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:15px}.iconbtn:hover{border-color:var(--line);color:var(--paper)}.tree-tools{padding:12px 12px 8px;display:flex;gap:6px}.tree-tools button{flex:1;background:var(--panel2);border:1px solid var(--line);padding:8px 4px;color:var(--muted);font-size:10px}.tree-tools button:hover{color:var(--lime);border-color:var(--lime)}.tree{padding:5px 8px;overflow:auto}.tree-row{width:100%;display:flex;align-items:center;gap:9px;padding:9px 8px;border:1px solid transparent;background:transparent;text-align:left;color:var(--muted);font-size:11px}.tree-row:hover{background:#ffffff08;color:var(--paper)}.tree-row[aria-current="true"]{background:#c7f36b12;border-color:#c7f36b55;color:var(--paper)}.tree-row .symbol{width:16px;text-align:center;color:var(--lime);font-size:13px}.tree-row .eye{margin-left:auto;color:#72746e}.tree-row .eye[aria-pressed="false"]{opacity:.35}.tree-footer{margin-top:auto;border-top:1px solid var(--line);padding:12px;color:var(--muted);font:9px var(--mono);letter-spacing:.06em}.center{min-width:0;display:flex;flex-direction:column;background:#141517}.viewport-toolbar{height:47px;border-bottom:1px solid var(--line);display:flex;align-items:center;padding:0 14px;gap:6px}.tool{min-width:32px;height:29px;border:1px solid transparent;background:transparent;color:var(--muted);font-size:11px}.tool[aria-pressed="true"],.tool:hover{border-color:var(--line);background:var(--panel2);color:var(--lime)}.tool-sep{width:1px;height:18px;background:var(--line);margin:0 5px}.viewport-mode{margin-left:auto;color:var(--muted)}.viewport{position:relative;flex:1;min-height:300px;overflow:hidden;display:grid;place-items:center;background-color:#151719;background-image:linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px);background-size:32px 32px}.viewport:before{content:"";position:absolute;inset:0;background:radial-gradient(ellipse at center,#ffffff08,transparent 64%);pointer-events:none}.floor{position:absolute;width:68%;height:32%;bottom:15%;border:1px solid #ffffff1c;transform:perspective(360px) rotateX(62deg);background:repeating-linear-gradient(90deg,transparent 0 38px,#ffffff0b 39px 40px),repeating-linear-gradient(0deg,transparent 0 38px,#ffffff0b 39px 40px)}.scene-objects{position:absolute;inset:0;display:grid;place-items:center}.scene-object{position:absolute;left:50%;top:50%;translate:-50% -50%;display:grid;place-items:center;cursor:pointer;outline:0;transition:filter .15s}.scene-object.selected:after{content:"";position:absolute;inset:-12px;border:1px solid var(--lime);box-shadow:0 0 0 1px #111214;pointer-events:none}.scene-object:focus-visible:after{outline:2px solid var(--paper);outline-offset:4px}.cube{width:92px;height:92px;background:linear-gradient(135deg,color-mix(in srgb,var(--object-color),white 28%),var(--object-color));transform:rotate(-22deg) skewY(8deg);box-shadow:18px 18px 0 #668b3a,35px 35px 28px #0008}.sphere{width:78px;height:78px;border-radius:50%;background:radial-gradient(circle at 30% 25%,color-mix(in srgb,var(--object-color),white 65%),var(--object-color) 45%,color-mix(in srgb,var(--object-color),black 48%) 85%);box-shadow:inset -13px -14px 25px #28100d88,0 20px 35px #0008}.plane{width:150px;height:82px;background:linear-gradient(135deg,color-mix(in srgb,var(--object-color),white 25%),color-mix(in srgb,var(--object-color),black 20%));transform:skewY(-22deg) rotate(14deg);box-shadow:0 18px 28px #0008}.viewport-label{position:absolute;left:16px;top:15px;color:#7c7e78}.axis{position:absolute;right:20px;bottom:20px;width:46px;height:46px;border-left:1px solid #ff765e;border-bottom:1px solid #8294ff}.axis:before{content:"";position:absolute;width:1px;height:27px;background:var(--lime);left:22px;bottom:0;transform:rotate(35deg);transform-origin:bottom}.canvas-hint{position:absolute;bottom:16px;left:16px;color:#797b75;font:9px var(--mono)}.statusbar{height:34px;flex:none;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;padding:0 14px;color:var(--muted);font:9px var(--mono)}.inspector{overflow:auto;padding:0 15px 20px}.selected-title{padding:17px 0 14px;border-bottom:1px solid var(--line)}.selected-title small{display:block;color:var(--muted);font:9px var(--mono);text-transform:uppercase;margin-bottom:7px}.selected-title strong{font:500 16px var(--display)}.property{padding:16px 0;border-bottom:1px solid var(--line)}.property-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:13px}.property-head h3{font:10px var(--mono);text-transform:uppercase;letter-spacing:.08em;margin:0}.fields{display:grid;grid-template-columns:repeat(3,1fr);gap:7px}.field label{display:block;color:var(--muted);font:9px var(--mono);margin-bottom:6px}.field input{width:100%;min-width:0;background:#111214;border:1px solid var(--line);padding:8px 5px;font:10px var(--mono);color:var(--paper)}.field input:focus{outline:1px solid var(--lime);border-color:var(--lime)}.wide-field{margin-top:12px}.wide-field label{display:block;color:var(--muted);font:9px var(--mono);margin-bottom:7px}.wide-field input{width:100%;background:#111214;border:1px solid var(--line);padding:9px;color:var(--paper);font-size:11px}.color-row{display:flex;align-items:center;gap:10px}.color-row input{width:32px;height:28px;padding:2px;background:#111214;border:1px solid var(--line)}.color-row span{color:var(--muted);font:10px var(--mono)}.empty-inspector{padding:28px 8px;color:var(--muted);line-height:1.7}.mobile-dock{display:none}.demo-note{position:fixed;z-index:20;left:50%;bottom:48px;transform:translateX(-50%);max-width:calc(100% - 28px);padding:9px 14px;background:#292b2d;border:1px solid #55585d;color:#d8d8d2;font:9px var(--mono);letter-spacing:.04em;text-align:center;box-shadow:0 8px 30px #0008}.sheet-backdrop{display:none}
@media(max-width:980px){.workspace{grid-template-columns:205px minmax(260px,1fr) 250px}.topbar{gap:12px;padding:0 12px}.scene-name{width:120px}}
@media(max-width:720px){.shell{height:100dvh;min-height:540px}.topbar{height:54px;padding:0 12px;gap:10px}.brand{font-size:15px}.divider,.saved,.top-actions .toolbtn:not(.primary),.avatar{display:none}.scene-name{width:min(34vw,130px);font-size:11px}.top-actions .primary{padding:7px 9px;font-size:10px}.workspace{display:block;position:relative;flex:1;min-height:0}.left,.right{display:none}.center{height:100%;padding-bottom:60px}.viewport-toolbar{height:42px}.viewport{min-height:220px}.statusbar{height:28px}.mobile-dock{position:absolute;display:grid;grid-template-columns:repeat(3,1fr);bottom:0;left:0;right:0;height:60px;padding-bottom:env(safe-area-inset-bottom);background:#1b1c1e;border-top:1px solid var(--line);z-index:5}.dockbtn{border:0;background:transparent;color:var(--muted);font:9px var(--mono);text-transform:uppercase;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}.dockbtn span{font-size:17px}.dockbtn[aria-pressed="true"]{color:var(--lime);background:#c7f36b0b}.sheet-backdrop{position:absolute;inset:0;background:#0009;z-index:8}.sheet{position:absolute;z-index:9;left:0;right:0;bottom:60px;max-height:72%;background:var(--panel);border-top:1px solid var(--line);border-radius:12px 12px 0 0;display:none;flex-direction:column;box-shadow:0 -12px 36px #0008}.sheet.open{display:flex}.sheet .panel{display:flex;max-height:100%;overflow:auto}.sheet .left,.sheet .right{border:0}.sheet .panel-head{height:44px}.sheet .tree{max-height:45vh}.sheet .inspector{overflow:auto}.sheet-grip{width:34px;height:3px;border-radius:3px;background:#686a65;margin:9px auto 0}.demo-note{bottom:68px;font-size:8px}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important;animation:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="shell">
<header class="topbar">
<div class="brand"><span class="mark" aria-hidden="true"></span>FORMA</div><div class="divider"></div>
<input class="scene-name" aria-label="Scene name" value="Untitled scene">
<div class="saved"><span class="dot"></span><span>Local preview</span></div>
<div class="top-actions"><button class="toolbtn" id="undo" type="button" disabled>↶ Undo</button><button class="toolbtn" id="redo" type="button" disabled>↷ Redo</button><button class="toolbtn primary" id="add-top" type="button">＋ Add object</button><div class="avatar" aria-label="Preview account">P</div></div>
</header>
<main class="workspace">
<aside class="panel left" id="hierarchy-panel">
<div class="panel-head"><h2>Scene hierarchy</h2><button class="iconbtn" id="add-side" aria-label="Add object">＋</button></div>
<div class="tree-tools"><button type="button" data-add="cube">＋ Cube</button><button type="button" data-add="sphere">＋ Sphere</button><button type="button" data-add="plane">＋ Plane</button></div>
<div class="tree" id="tree" role="tree" aria-label="Scene objects"></div>
<div class="tree-footer">SCENE / LOCAL SESSION</div>
</aside>
<section class="center" aria-label="Scene viewport">
<div class="viewport-toolbar"><button class="tool" aria-label="Select tool" aria-pressed="true">↖</button><button class="tool" aria-label="Move tool" aria-pressed="false">✣</button><button class="tool" aria-label="Rotate tool" aria-pressed="false">⟳</button><button class="tool" aria-label="Scale tool" aria-pressed="false">□</button><span class="tool-sep"></span><button class="tool" id="frame-view" aria-label="Frame selected object">⌗</button><button class="tool" id="grid-toggle" aria-label="Toggle grid" aria-pressed="true">▦</button><span class="viewport-mode mono">PERSPECTIVE · 3D</span></div>
<div class="viewport" id="viewport"><span class="viewport-label mono">VIEWPORT / PERSPECTIVE</span><div class="floor" id="floor"></div><div class="scene-objects" id="scene-objects"></div><div class="axis" aria-hidden="true"></div><span class="canvas-hint">SELECT AN OBJECT TO INSPECT</span></div>
<div class="statusbar"><span id="selection-status">NO SELECTION</span><span>LOCAL UI PREVIEW · NOT SAVED</span><span id="object-count">03 OBJECTS</span></div>
</section>
<aside class="panel right" id="inspector-panel">
<div class="panel-head"><h2>Properties</h2><button class="iconbtn" id="delete" aria-label="Delete selected object">⌫</button></div>
<div class="inspector" id="inspector"></div>
</aside>
<div class="sheet-backdrop" id="backdrop"></div>
<div class="sheet" id="sheet"><div class="sheet-grip"></div><div id="sheet-content"></div></div>
<nav class="mobile-dock" aria-label="Editor panels"><button class="dockbtn" data-sheet="hierarchy" aria-pressed="false"><span>☷</span>Objects</button><button class="dockbtn" data-sheet="tools" aria-pressed="true"><span>✣</span>Tools</button><button class="dockbtn" data-sheet="inspector" aria-pressed="false"><span>☷</span>Inspect</button></nav>
</main>
<div class="demo-note">INTERFACE PROTOTYPE · LOCAL-ONLY · NO 3D ENGINE OR CLOUD SAVE</div>
</div>
<script>
const objects=[
{id:1,name:"Cube",type:"cube",color:"#c7f36b",x:0,y:0,z:0,visible:true},
{id:2,name:"Sphere",type:"sphere",color:"#ff765e",x:1.6,y:.5,z:0,visible:true},
{id:3,name:"Plane",type:"plane",color:"#8294ff",x:-1.5,y:-.5,z:0,visible:true}
];
let selected=1,nextId=4,history=[],historyIndex=-1;
const tree=document.getElementById("tree"),canvas=document.getElementById("scene-objects"),inspector=document.getElementById("inspector");
const selectionStatus=document.getElementById("selection-status"),objectCount=document.getElementById("object-count");
function snapshot(){history=history.slice(0,historyIndex+1);history.push(JSON.stringify({objects,selected,nextId}));historyIndex=history.length-1;document.getElementById("undo").disabled=historyIndex<=0;document.getElementById("redo").disabled=true}
function restore(direction){const target=historyIndex+direction;if(target<0||target>=history.length)return;historyIndex=target;const state=JSON.parse(history[target]);objects.splice(0,objects.length,...state.objects);selected=state.selected;nextId=state.nextId;render();document.getElementById("undo").disabled=historyIndex<=0;document.getElementById("redo").disabled=historyIndex>=history.length-1}
function render(){
 tree.innerHTML="";
 objects.forEach(o=>{const row=document.createElement("div");row.className="tree-row";row.setAttribute("role","treeitem");row.setAttribute("aria-current",String(o.id===selected));const select=document.createElement("button");select.className="tree-row";select.setAttribute("aria-current",String(o.id===selected));select.innerHTML='<span class="symbol">'+(o.type==="cube"?"◇":o.type==="sphere"?"◉":"▱")+'</span><span></span>';select.querySelector("span:nth-child(2)").textContent=o.name;select.addEventListener("click",()=>{selected=o.id;render()});const eye=document.createElement("button");eye.className="iconbtn eye";eye.textContent=o.visible?"◉":"○";eye.setAttribute("aria-label",(o.visible?"Hide ":"Show ")+o.name);eye.setAttribute("aria-pressed",String(o.visible));eye.addEventListener("click",()=>{o.visible=!o.visible;snapshot();render()});select.appendChild(eye);tree.appendChild(select)});
 canvas.innerHTML="";
 objects.forEach((o,i)=>{const el=document.createElement("button");el.className="scene-object "+o.type+(o.id===selected?" selected":"");el.type="button";el.setAttribute("aria-label","Select "+o.name);el.style.left="calc(50% + "+(o.x*38+(i===0?-20:0))+"px)";el.style.top="calc(50% + "+(o.y*28+(i===1?-34:i===2?38:0))+"px)";el.style.display=o.visible?"grid":"none";el.style.setProperty("--object-color",o.color);el.addEventListener("click",()=>{selected=o.id;render()});canvas.appendChild(el)});
 const obj=objects.find(o=>o.id===selected);
 selectionStatus.textContent=obj?obj.name.toUpperCase()+" SELECTED":"NO SELECTION";
 objectCount.textContent=String(objects.length).padStart(2,"0")+" OBJECTS";
 if(obj){inspector.innerHTML='<div class="selected-title"><small>Selected object</small><strong id="selected-name"></strong></div><section class="property"><div class="property-head"><h3>Transform</h3><span class="mono">XYZ</span></div><div class="fields">'+["x","y","z"].map(k=>'<div class="field"><label for="p-'+k+'">'+k.toUpperCase()+'</label><input id="p-'+k+'" type="number" step=".1" value="'+obj[k]+'"></div>').join("")+'</div></section><section class="property"><div class="property-head"><h3>Appearance</h3></div><div class="color-row"><input type="color" id="color" value="'+obj.color+'"><span>'+obj.color.toUpperCase()+'</span></div></section><div class="wide-field"><label for="object-name">OBJECT NAME</label><input id="object-name" value=""></div>';
 document.getElementById("selected-name").textContent=obj.name;
 document.getElementById("object-name").value=obj.name;
 ["x","y","z"].forEach(k=>document.getElementById("p-"+k).addEventListener("change",e=>{obj[k]=Number(e.target.value)||0;snapshot();render()}));
 document.getElementById("color").addEventListener("input",e=>{obj.color=e.target.value;snapshot();render()});
 document.getElementById("object-name").addEventListener("change",e=>{obj.name=e.target.value.trim()||obj.name;snapshot();render()});
 }else inspector.innerHTML='<div class="empty-inspector">Nothing selected.<br><br>Select an object in the scene or hierarchy to inspect its properties.</div>';
}
function addObject(type="cube"){const id=nextId++;objects.push({id,name:type[0].toUpperCase()+type.slice(1)+" "+id,type,color:type==="cube"?"#c7f36b":type==="sphere"?"#ff765e":"#8294ff",x:(objects.length%3)-1,y:0,z:0,visible:true});selected=id;snapshot();render();closeSheet()}
function deleteSelected(){const index=objects.findIndex(o=>o.id===selected);if(index<0)return;objects.splice(index,1);selected=objects.length?objects[Math.max(0,index-1)].id:null;snapshot();render()}
function openSheet(which){const sheet=document.getElementById("sheet"),content=document.getElementById("sheet-content"),backdrop=document.getElementById("backdrop");document.querySelectorAll(".dockbtn").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sheet===which)));if(which==="tools"){closeSheet();return}const source=which==="hierarchy"?document.getElementById("hierarchy-panel"):document.getElementById("inspector-panel");content.innerHTML="";const clone=source.cloneNode(true);clone.classList.remove("left","right");clone.style.display="flex";clone.style.maxHeight="65vh";if(which==="hierarchy"){clone.querySelector("#tree")?.removeAttribute("id");clone.querySelectorAll(".tree-row").forEach(row=>row.addEventListener("click",()=>{const name=row.textContent.trim();const obj=objects.find(o=>o.name===name);if(obj){selected=obj.id;render();openSheet("hierarchy")}}));clone.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>addObject(b.dataset.add)))}else{clone.querySelector("#inspector")?.removeAttribute("id");clone.querySelectorAll("input").forEach(input=>input.disabled=true)}content.appendChild(clone);sheet.classList.add("open");backdrop.style.display="block"}
function closeSheet(){document.getElementById("sheet").classList.remove("open");document.getElementById("backdrop").style.display="none";document.querySelectorAll(".dockbtn").forEach(b=>b.setAttribute("aria-pressed",String(b.dataset.sheet==="tools")))}
document.querySelectorAll("[data-add]").forEach(b=>b.addEventListener("click",()=>addObject(b.dataset.add)));
document.getElementById("add-top").addEventListener("click",()=>addObject("cube"));
document.getElementById("add-side").addEventListener("click",()=>addObject("cube"));
document.getElementById("delete").addEventListener("click",deleteSelected);
document.getElementById("undo").addEventListener("click",()=>restore(-1));
document.getElementById("redo").addEventListener("click",()=>restore(1));
document.querySelectorAll(".tool[aria-label]").forEach(b=>{if(b.id==="frame-view"||b.id==="grid-toggle")return;b.addEventListener("click",()=>{document.querySelectorAll(".tool").forEach(t=>t.setAttribute("aria-pressed","false"));b.setAttribute("aria-pressed","true")})});
document.getElementById("grid-toggle").addEventListener("click",e=>{const on=e.currentTarget.getAttribute("aria-pressed")!=="true";e.currentTarget.setAttribute("aria-pressed",String(on));document.getElementById("viewport").style.backgroundImage=on?"linear-gradient(#ffffff0a 1px,transparent 1px),linear-gradient(90deg,#ffffff0a 1px,transparent 1px)":"none";document.getElementById("floor").style.display=on?"block":"none"});
document.getElementById("frame-view").addEventListener("click",()=>{const el=canvas.querySelector(".selected");if(el){el.animate([{filter:"brightness(1)"},{filter:"brightness(1.8)"},{filter:"brightness(1)"}],{duration:420})}});
document.querySelectorAll(".dockbtn").forEach(b=>b.addEventListener("click",()=>openSheet(b.dataset.sheet)));
document.getElementById("backdrop").addEventListener("click",closeSheet);
document.addEventListener("keydown",e=>{if(e.key==="Escape")closeSheet();if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==="z"){e.preventDefault();restore(e.shiftKey?1:-1)}});
snapshot();render();
</script>
</body>
</html>
